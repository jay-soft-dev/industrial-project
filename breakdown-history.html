<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breakdown History — ToolSync PM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: "class", theme: { extend: { fontFamily: { sans: ["Space Grotesk", "sans-serif"], mono: ["JetBrains Mono", "monospace"] } } } };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="bg-[#0b0d11] text-stone-100 min-h-screen antialiased">
    <header class="sticky top-0 z-30 border-b border-stone-800 bg-[#0b0d11]/95 backdrop-blur px-4 sm:px-6 py-3 flex items-center gap-2.5">
        <button id="toggle-slide-btn" type="button" class="px-3 py-1.5 rounded-lg bg-[#181d28] border border-amber-400/50 text-amber-300 font-mono text-xs font-bold">&#9776; Slide</button>
        <span class="font-bold text-sm sm:text-base text-rose-400">Breakdown History Page</span>
    </header>
    <div id="page-shell" class="max-w-[1440px] mx-auto px-4 sm:px-6 py-4 grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
        <aside id="slide-menu-aside" class="lg:col-span-3 rounded-2xl border border-stone-800 bg-[#11151d] p-2.5 space-y-1.5"></aside>
        <main class="lg:col-span-9 space-y-4">
            <section class="rounded-2xl bg-[#11151d] border border-rose-500/40 p-4 space-y-3">
                <h2 class="text-base font-bold">Breakdown History (All Months Saved)</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="border-b border-stone-800 text-[10px] font-mono uppercase text-stone-400 bg-[#0d1017]">
                                <th class="py-2.5 px-3">DATE</th>
                                <th class="py-2.5 px-3">BREAKDOWN MOULD NUM</th>
                                <th class="py-2.5 px-3">REASON</th>
                                <th class="py-2.5 px-3">STATUS</th>
                                <th class="py-2.5 px-3">M/C NO</th>
                                <th class="py-2.5 px-3">TIME</th>
                            </tr>
                        </thead>
                        <tbody id="bd-history-tbody" class="divide-y divide-stone-800/60"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="shared.js"></script>
    <script src="breakdown-history.js"></script>
</body>
</html>
