<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breakdown — ToolSync PM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: "class", theme: { extend: { fontFamily: { sans: ["Space Grotesk", "sans-serif"], mono: ["JetBrains Mono", "monospace"] } } } };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="bg-[#0b0d11] text-stone-100 min-h-screen antialiased">
    <header class="sticky top-0 z-30 border-b border-stone-800 bg-[#0b0d11]/95 backdrop-blur px-4 sm:px-6 py-3 flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5">
            <button id="toggle-slide-btn" type="button" class="px-3 py-1.5 rounded-lg bg-[#181d28] border border-amber-400/50 text-amber-300 font-mono text-xs font-bold">&#9776; Slide</button>
            <span class="font-bold text-sm sm:text-base text-rose-400">Breakdown Page</span>
        </div>
        <button id="enter-bd-btn" type="button" class="px-3 py-1.5 rounded-lg bg-rose-500 text-white font-mono text-xs font-bold">
            + Enter Data
        </button>
    </header>

    <div id="page-shell" class="max-w-[1440px] mx-auto px-4 sm:px-6 py-4 grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
        <aside id="slide-menu-aside" class="lg:col-span-3 rounded-2xl border border-stone-800 bg-[#11151d] p-2.5 space-y-1.5"></aside>

        <main class="lg:col-span-9 space-y-4">
            <section class="rounded-2xl bg-[#11151d] border border-rose-500/40 p-4 space-y-3">
                <h2 class="text-xs font-mono uppercase text-rose-300 font-bold">Enter Data</h2>
                <form id="bd-form" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-2.5">
                    <input id="bd-date" type="date" required class="bg-[#0b0d11] border border-stone-700 rounded-lg px-2.5 py-2 text-xs font-mono text-rose-300" />
                    <input id="bd-mould" type="text" required placeholder="Breakdown Mould Num" class="bg-[#0b0d11] border border-stone-700 rounded-lg px-2.5 py-2 text-xs font-mono" />
                    <input id="bd-reason" type="text" required placeholder="Reason" class="bg-[#0b0d11] border border-stone-700 rounded-lg px-2.5 py-2 text-xs" />
                    <input id="bd-status" type="text" required placeholder="Status" class="bg-[#0b0d11] border border-stone-700 rounded-lg px-2.5 py-2 text-xs font-mono" />
                    <input id="bd-mc" type="text" required placeholder="M/C No" class="bg-[#0b0d11] border border-stone-700 rounded-lg px-2.5 py-2 text-xs font-mono" />
                    <div class="flex gap-1.5">
                        <input id="bd-time" type="text" required placeholder="Time" class="w-full min-w-0 bg-[#0b0d11] border border-stone-700 rounded-lg px-2.5 py-2 text-xs font-mono" />
                        <button type="submit" class="bg-rose-500 hover:bg-rose-400 text-white font-mono font-bold text-xs rounded-lg px-3 py-2 shrink-0">Save</button>
                    </div>
                </form>
            </section>

            <section class="rounded-2xl bg-[#11151d] border border-stone-800 p-4 space-y-3">
                <div class="flex items-center justify-between">
                    <h3 id="bd-month-heading" class="font-bold text-sm text-amber-300">12-Month Calendar</h3>
                    <div class="flex gap-1.5 font-mono text-xs">
                        <button id="bd-prev-m" type="button" class="px-2.5 py-1 rounded-lg bg-[#0b0d11] border border-stone-700">&larr;</button>
                        <button id="bd-next-m" type="button" class="px-2.5 py-1 rounded-lg bg-[#0b0d11] border border-stone-700">&rarr;</button>
                    </div>
                </div>
                <div id="bd-month-pills" class="flex items-center gap-1.5 overflow-x-auto pb-1 font-mono text-xs"></div>
                <div class="grid grid-cols-7 gap-1.5 text-center text-[10px] font-mono text-stone-400">
                    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                </div>
                <div id="bd-days-grid" class="grid grid-cols-7 gap-1.5"></div>
            </section>
        </main>
    </div>

    <div id="toast" class="fixed bottom-5 right-5 z-50 translate-y-20 opacity-0 pointer-events-none transition-all duration-300 rounded-xl bg-stone-900 border border-rose-400/50 px-4 py-2.5 text-xs font-mono text-rose-200"></div>
    <script src="shared.js"></script>
    <script src="breakdown.js"></script>
</body>
</html>
